# Where the dataset of generated texts lives. Used by `python main.py dataset ...`.
#
# There is nothing here about any particular folder of generated text. What is
# known about a text — its title, the question it answers, the model that wrote
# it — is kept in the YAML block at the top of the text's own file, so a new run
# of generations needs no new lines in this file. The folder a text sits in
# gives its rows their source name, and that is all.

hub:
  # The dataset repository on the Hugging Face Hub. The TINYFACTS_HF_REPO
  # environment variable, and `--repo`, both win over this.
  repo_id: Stur86/tinyfacts
  # Only used when the repo is made for the first time.
  private: false
  data_dir: data
  chunk_prefix: tinyfacts
  license: cc-by-4.0

store:
  # The working copy on this machine. It is not kept in git.
  path: .dataset
  # How many rows go in one .jsonl chunk. Adding rows only rewrites the last
  # one, so a push sends a small file instead of the whole dataset.
  chunk_size: 2000
